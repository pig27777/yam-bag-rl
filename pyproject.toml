[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-bag-rl"
version = "0.1.0"
requires-python = ">=3.11"
description = "Standalone Yam_B and Monday dual-tether surrogate with Policy V3"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
